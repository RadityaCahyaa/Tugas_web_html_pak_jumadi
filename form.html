<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Acount Baru</title>
</head> 
    
    <h1>Buat Acount Baru</h1>
    <h2>Sign Up Form</h2>

    <form action="welcome.html">

    <p>First name :</p>
    <input type="text" placeholder="Masukan nama Anda">

    <p>Last name :</p>
    <input type="text" placeholder="Masukan nama Belakang Anda">

    <p>Gender</p>

    <div>
        <input type="radio" id="Male" name="opsi" value="A">
        <label for="Male">Male</label>
    </div>

    <div>
        <input type="radio" id="Female" name="opsi" value="B">
        <label for="Female">Female</label>
    </div>

<p>Nationality</p>
    <select name="Nationality" id="Nationality">
        <option value="Indonesia">Indonesia</option>
        <option value="English">English</option>
        <option value="German">German</option>
        <option value="Japan">Japan</option>
    </select>

    <p>Language Spoken</p>
    <div>
        <input type="checkbox" id="id" name="lang" value="Indonesia">
        <label for="id">Indonesia</label>
    </div>

    <div>
        <input type="checkbox" id="en" name="lang" value="English">
        <label for="en">English</label>
    </div>

    <div>
        <input type="checkbox" name="Lang" id="Ot" value="Other">
        <label for="Ot">Other</label>
    </div>
    
    <p>Bio</p>
    <textarea name="bio" id="bio" rows="10" cols="35"></textarea>
    <div>
    <button>Sign Up</button>
    </div>
</form>    
</body>
</html>
